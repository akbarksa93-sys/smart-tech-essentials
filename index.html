<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tech & Life Essentials Showcase</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f9;
      color: #333;
      padding: 20px;
    }
    
    /* Header & Navigation */
    header {
      text-align: center;
      padding: 30px 10px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #ffffff;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    header h1 {
      font-size: 2.2rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    header p {
      font-size: 1rem;
      color: #94a3b8;
    }

    /* Grid Layout for Product Cards */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card Styling */
    .card {
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      padding: 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* Number Badge */
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      z-index: 2;
    }

    /* Product Image */
    .card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 12px;
      background-color: #fafafa;
    }

    /* Product Details */
    .card h3 {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #1e293b;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 2.8em;
    }
    .card .price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #059669;
      margin-bottom: 12px;
    }

    /* Direct Referral Button */
    .buy-btn {
      display: block;
      text-align: center;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 0;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }
    .buy-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Smart Tech & Life Essentials</h1>
    <p>Curated Collection of Next-Gen Gadgets, Smart Devices & Daily Essentials</p>
  </header>

  <main class="product-grid">

    <!-- Card 1 Example -->
    <div class="card">
      <span class="badge">1</span>
      <img src="https://via.placeholder.com/300" alt="Smart Product Showcase">
      <h3>Smart Touchscreen Fitness Watch & Activity Tracker</h3>
      <p class="price">$49.99</p>
      <a href="#" class="buy-btn" target="_blank">Shop Now</a>
    </div>

  </main>

</body>
</html>
